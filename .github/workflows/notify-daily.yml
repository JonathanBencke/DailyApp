name: Notify daily presenter

on:
  schedule:
    # 14:55 BRT (UTC-3), Monday through Friday.
    - cron: '55 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: https://scrum.my-board.org
      DAILY_TEAM: ${{ secrets.DAILY_TEAM }}
      DAILY_PASSWORD: ${{ secrets.DAILY_PASSWORD }}
      TEAMS_FLOW_WEBHOOK: ${{ secrets.TEAMS_FLOW_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/notify-daily.mjs
